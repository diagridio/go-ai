# Local Dapr state store for `dapr run`. One Redis component serves both the
# Dapr Workflow engine (actorStateStore) and the go-ai agent registry — locally
# the runner falls back to this "kvstore". On Diagrid Catalyst the runner instead
# registers into the managed "agent-registry" component, so you don't need this file.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kvstore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
