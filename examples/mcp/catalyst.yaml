version: 1
common:
  logLevel: info
  appLogDestination: console
  enableAppHealthCheck: false
apps:
  - appID: mcp-assistant
    appDirPath: ./
    command: ["go", "run", "."]
    env:
      GOWORK: "off"   # build this example standalone (ignore any parent go.work)
